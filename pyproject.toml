[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zorsch"
version = "0.2.0"
description = "A research copilot CLI (zr) built on a local Zotero library."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wheatfox" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
mineru = ["mineru-open-api>=0.1"]
embed = ["sentence-transformers>=3.0", "numpy>=1.26"]
web = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[project.scripts]
zr = "zoresearch.cli:app"

[project.urls]
Homepage = "https://github.com/enkerewpo/zoresearch"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zoresearch = ["py.typed"]
